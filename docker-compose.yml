services:
  app:
    build: .
    image: mtg-collection-value-tracker
    restart: unless-stopped
    ports:
      - "${PORT:-3000}:3000"
    environment:
      # The SQLite file. Keep it inside the mounted volume or the collection is
      # lost when the container is replaced.
      DATABASE_PATH: /app/data/mtg.db
      # Daily refresh: Scryfall metadata, then MTGJSON prices. 10:00 UTC is
      # overnight across the Americas, so the ingest has the write lock to
      # itself, and it sits just under an hour after Scryfall's ~09:05 UTC
      # build. UTC rather than a local zone, so that gap does not move with
      # daylight saving. MTGJSON's build time varies, and a run arriving before
      # it finds the same version and skips.
      CRON_ENABLED: "true"
      CRON_SCHEDULE: "${CRON_SCHEDULE:-0 10 * * *}"
      CRON_TIMEZONE: "${CRON_TIMEZONE:-UTC}"
      # How the price ingest is launched. The image sets a working default;
      # override to point at a different runtime, or set it empty to skip
      # prices here and run `ingest:today` from outside the container.
      INGEST_COMMAND: "${INGEST_COMMAND:-node_modules/.bin/tsx scripts/ingest-today.mts --rebuild-cache}"
      # Kills a wedged ingest rather than letting it hold the write lock until
      # the next day's run collides with it.
      INGEST_TIMEOUT_MS: "${INGEST_TIMEOUT_MS:-1800000}"
    volumes:
      # A bind mount rather than a named volume: the whole point of SQLite here
      # is that backing up the collection is copying one file, which is a lot
      # easier when you can see it.
      #
      # Linux hosts only, in practice. SQLite depends on POSIX advisory locking,
      # and a bind mount from a Windows or macOS host crosses a filesystem
      # translation layer where that is emulated rather than native — slow for a
      # 25 GB database, and not something to trust a WAL to. Develop on the host
      # with `npm run dev` and run the container where the data actually lives;
      # if you must run it on a desktop, use a named volume instead.
      #
      # DATA_DIR keeps the host path out of this tracked file, so a deployment
      # that stores its database somewhere else does not have to edit compose
      # and then resolve a conflict on every `git pull`. Set it in .env.
      - ${DATA_DIR:-./data}:/app/data
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 1m
      timeout: 10s
      # The first run downloads and ingests ~108,000 printings, which takes a
      # couple of minutes; do not report unhealthy while that is happening.
      start_period: 5m
      retries: 3
